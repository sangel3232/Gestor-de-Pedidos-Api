# ===============================
# SERVIDOR
# ===============================
server.port=8080

# ===============================
# BASE DE DATOS - PostgreSQL / variables de entorno
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestor_pedidos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=GestorPedidosPool

# ===============================
# PASARELA DE PAGOS
# ===============================
pagos.proveedor=${PAGOS_PROVEEDOR:MOCK}
pagos.stripe.api-key=${STRIPE_API_KEY:}
pagos.stripe.currency=${STRIPE_CURRENCY:usd}

# ===============================
# JPA / HIBERNATE  (ddl-auto=none: Flyway gestiona el esquema)
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=10
spring.jpa.open-in-view=false

# ===============================
# LIQUIBASE
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=public

# ===============================
# JACKSON - Serialización JSON
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# PAGINACION
# ===============================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ===============================
# LOGGING
# ===============================
logging.level.com.sergio.gestor_pedidos=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.liquibase=INFO

# ===============================
# H2 DESACTIVADO
# ===============================
spring.h2.console.enabled=false
